name: Build PinSte

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile PinSte.exe via MSVC
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl.exe /O2 /DUNICODE /D_UNICODE main.cpp /Fe:PinSte.exe /link user32.lib gdi32.lib shell32.lib /SUBSYSTEM:WINDOWS

    - name: Upload PinSte.exe
      uses: actions/upload-artifact@v4
      with:
        name: PinSte-Windows-Application
        path: PinSte.exe
