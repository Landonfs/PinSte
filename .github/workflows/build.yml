name: Build PinSte

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile PinSte.exe
      run: |
        cl.exe /O2 /DUNICODE /D_UNICODE main.cpp /Fe:PinSte.exe /link user32.lib gdi32.lib shell32.lib /SUBSYSTEM:WINDOWS

    - name: Upload PinSte.exe
      uses: actions/upload-artifact@v4
      with:
        name: PinSte-Windows-Application
        path: PinSte.exe
